[project]
name = "patchpilot"
version = "0.1.0"
description = "Vulnerability triage and test-verified remediation: merges scanner output, prioritizes by exploitability and reachability, gates CI on new findings, and finds the largest safe upgrade set"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["packaging>=23", "pyyaml>=6"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
